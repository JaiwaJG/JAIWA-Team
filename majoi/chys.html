<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaiwa Team - Speed Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #999da7;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; font-size: 1.8rem; }
        p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }
        .gauge {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4ade80;
            margin: 1.5rem 0;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>Speed Test</h1>
    <p>Jaiwa Team</p>

    <div class="gauge" id="speedDisplay">0.00 <span style="font-size: 1rem;">Mbps</span></div>

    <button id="startBtn" onclick="runSpeedTest()">Test Speed</button>
</div>

<script>
async function runSpeedTest() {
    const btn = document.getElementById('startBtn');
    const display = document.getElementById('speedDisplay');
    
    btn.disabled = true;
    btn.innerText = "Measuring...";
    display.innerHTML = `Measuring...`;

    // 10MB test file for downloading
    const testFileUrl = "https://speed.cloudflare.com/__down?bytes=10000000"; 
    const startTime = new Date().getTime();

    try {
        const response = await fetch(testFileUrl + "&cacheBust=" + startTime);
        const reader = response.body.getReader();
        let receivedBytes = 0;

        while(true) {
            const {done, value} = await reader.read();
            if (done) break;
            receivedBytes += value.length;
        }

        const endTime = new Date().getTime();
        const durationInSeconds = (endTime - startTime) / 1000;
        const bitsLoaded = receivedBytes * 8;
        const speedMbps = ((bitsLoaded / durationInSeconds) / (1024 * 1024)).toFixed(2);

        display.innerHTML = `${speedMbps} <span style="font-size: 1rem;">Mbps</span>`;
    } catch (error) {
        display.innerHTML = `<span style="color: #ef4444; font-size: 1rem;">Error testing speed</span>`;
    } finally {
        btn.disabled = false;
        btn.innerText = "Test Speed Again";
    }
}
</script>

</body>
</html>
