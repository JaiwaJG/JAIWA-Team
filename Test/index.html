    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
        }
        .orb-1 { width: 300px; height: 300px; background: #6366f1; top: 15%; left: 20%; }
        .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: 15%; right: 20%; }

        /* Navigation Bar */
        .nav-ctn {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-ctn .logo span { font-weight: 600; color: #fff; }
        .nav-ctn .nav-right a { margin-left: 1rem; color: #fff; text-decoration: none; }
        .nav-ctn .menu-btn { display: none; }

        /* Footer */
        .footer-ctn {
            width: 100%;
            text-align: center;
            padding: 2rem 0;
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            margin-top: auto;
        }

        /* Main container */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-top: 80px;
            padding-bottom: 60px;
        }

        .glass-card {
            width: min(90%, 460px);
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            text-align: center;
            position: relative; /* ensure inner absolute elements are positioned relative to card */
            z-index: 10;
            height: auto;
            min-height: fit-content;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding-bottom: 24px; /* extra space for expanded info */
        }
        /* Ensure settings icon is positioned inside the card */
        #speedCard .settings-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        /* Center the Show More Info button within the card */
        #speedCard .btn-toggle {
            margin-top: 24px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .brand-logo { font-size: 0.9rem; letter-spacing: 4px; color: rgba(255,255,255,0.6); font-weight: 700; margin-bottom: 0.5rem; }
        .tagline { font-size: 1.1rem; color: rgba(255,255,255,0.8); margin-bottom: 1.5rem; }

        .speed-box {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .number {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            color: #ffffff;
            transition: color 0.3s ease;
        }

        .number.testing {
            background: linear-gradient(180deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .number.finished {
            background: none;
            -webkit-text-fill-color: initial;
            color: rgba(255, 255, 255, 0.85);
        }

        .unit-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
            /* Fixed container to keep unit and button together */
        }
        #numDisplay {
            min-width: 180px;
            display: inline-block;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .unit { font-size: 1.8rem; font-weight: 700; color: rgba(255, 255, 255, 0.5); }
        
        .action-icon-btn {
            position: relative;
            width: 38px;
            height: 38px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;

            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-icon-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-top-color: #6366f1;
            border-radius: 50%;
        }
        .action-icon-btn.testing::before {
            animation: spinRing 1.2s linear infinite;
        }
        .action-icon-btn.finished::before {
            border: 2px solid #22c55e;
            border-radius: 50%;
            animation: none;
        }
        .action-icon-btn.finished {
            color: #22c55e;
        }
        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .action-icon-btn:hover::before {
            border-color: #fff;
        }
        .action-icon-btn:hover, .action-icon-btn:focus { 
            color: #fff;

            outline: none;
            border-color: transparent;
        }

            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1);
            margin-top: 1rem;
        }
        #moreInfo {
            width: 100%;
            text-align: left;
        }
        .info-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 16px !important;
            width: 100% !important;
        }
        .full-width {
            grid-column: 1 / -1;
        }

        .more-info-container.open {
            max-height: 300px;
            transition: max-height 0.5s ease-in-out;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .stat-item .label { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
        .stat-item .val { font-size: 1.2rem; font-weight: 700; color: #fff; }

        /* Show More Button Styling */
        /* Removed malformed duplicate save button styling block */

        /* Test လုပ်နေစဉ် ခလုတ်နှိပ်မရသည့် ပုံစံ */
        .btn-toggle:disabled {

        .hidden { display: none; }

            width: 38px;
            height: 38px;

            justify-content: center;
            border: 2px solid rgba(255,255,255,0.3);

        .settings-icon:hover {

        }
        /* Modal overlay for settings */
        .modal {
            display: none; /* hidden by default */

            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            z-index: 9999 !important;
            overflow: hidden;
        }
        .modal:not(.hidden) {

        .modal-content {

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            color: #fff;
            position: relative;
            text-align: left;
        }
        #ispInfo {
            font-size: 0.85rem;
            line-height: 1.2;
            font-weight: 600;
        }
        .modal-content select {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 8px;
            padding: 8px 12px;

            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .modal-content select option {
            background: #0f172a !important;
            color: #ffffff !important;
        }
        /* Global removal of default number input spinners and styling */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
        }
        input[type=number] {
            -moz-appearance: textfield !important;
            appearance: textfield !important;
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 8px !important;
        }
        </style>

<script>
/*** Speed Test Core Logic ***/
let isTesting = false;
let abortController = null;
let animInterval = null;
let timerId = null;

// Load persisted settings or defaults
const defaultSettings = { duration: 30, connections: 4, upload: false };
let settings = { ...defaultSettings, ...(JSON.parse(localStorage.getItem('speedTestSettings') || '{}')) };

// Global counters for data usage
let totalDownloadedBytes = 0;
let totalUploadedBytes = 0;

window.addEventListener('DOMContentLoaded', () => {
    fetchClientInfo();
    applySettingsToUI();
    runSpeedTest();
    initSettingsPanel();
});

function applySettingsToUI() {
    const durationSelect = document.getElementById('durationSelect');
    const connectionsSelect = document.getElementById('connectionsSelect');
    const uploadToggle = document.getElementById('uploadToggle');
    if (durationSelect) durationSelect.value = settings.duration;
    if (connectionsSelect) connectionsSelect.value = settings.connections;
    if (uploadToggle) uploadToggle.checked = settings.upload;
    // No custom dropdowns needed – standard <select> elements reflect settings directly
}

function initSettingsPanel() {
    const settingsIcon = document.getElementById('settingsIcon');
    const settingsModal = document.getElementById('settingsModal');
    const saveBtn = document.getElementById('saveSettings');
    const closeBtn = document.getElementById('closeSettings');
    const durationSelect = document.getElementById('durationSelect');
    const connectionsSelect = document.getElementById('connectionsSelect');
    const uploadToggle = document.getElementById('uploadToggle');

    // Toggle modal visibility
    settingsIcon.addEventListener('click', () => {
        settingsModal.classList.toggle('hidden');
    });

    // Save settings and close modal
    saveBtn.addEventListener('click', () => {
        const newSettings = {
            duration: parseInt(durationSelect.value) || 30,
            connections: parseInt(connectionsSelect.value) || 4,
            upload: uploadToggle.checked
        };
        localStorage.setItem('speedTestSettings', JSON.stringify(newSettings));
        settings = newSettings;
        settingsModal.classList.add('hidden');
    });

    // Close modal without saving
    closeBtn.addEventListener('click', () => {
        settingsModal.classList.add('hidden');
    });

    // Initialize custom glass dropdowns
    initCustomDropdowns();
    // No custom steppers needed for dropdowns
}

/** Initialize custom dropdown behavior */
function initCustomDropdowns() {
    const dropdowns = document.querySelectorAll('.custom-dropdown');
    dropdowns.forEach(dd => {
        const toggle = dd.querySelector('.dropdown-toggle');
        const menu = dd.querySelector('.dropdown-menu');
        const hiddenSelect = dd.parentElement.querySelector('select');
        // Toggle open/close
        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = menu.classList.toggle('open');
            toggle.classList.toggle('open', isOpen);
        });
        // Option selection
        menu.querySelectorAll('li').forEach(li => {
            li.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = li.getAttribute('data-value');
                const label = li.textContent;
                // Update displayed selected value
                const selectedSpan = toggle.querySelector('.selected-value');
                if (selectedSpan) selectedSpan.textContent = label;
                // Update hidden native select if present
                if (hiddenSelect) hiddenSelect.value = value;
                // Close menu
                menu.classList.remove('open');
                toggle.classList.remove('open');
            });
        });
    });
    // Close any open dropdown when clicking outside
    document.addEventListener('click', () => {
        document.querySelectorAll('.custom-dropdown .dropdown-menu.open').forEach(openMenu => {
            openMenu.classList.remove('open');
            const parent = openMenu.closest('.custom-dropdown');
            if (parent) {
                const toggleBtn = parent.querySelector('.dropdown-toggle');
                if (toggleBtn) toggleBtn.classList.remove('open');
            }
        });
    });
}

function handleActionClick() {
    if (isTesting) {
        stopSpeedTest();
    } else {
        runSpeedTest();
    }
}

// Fetch client IP and location with robust fallback
function fetchClientInfo() {
    // First try ipapi.co (CORS friendly)
    fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(info => {
            const ip = info.ip || '';
            const city = info.city || '';
            const country = info.country_code || '';
            const location = city && country ? `${city}, ${country}` : '';
            const clientText = location ? `Client ${location} ${ip}` : `Client ${ip}`;
            document.getElementById('clientInfo').innerText = clientText;
            document.getElementById('serverInfo').innerText = location ? `Server(s) ${location}` : 'Server(s)';
        })
        .catch(() => {
            // Fallback to Cloudflare trace
            fetch('https://speed.cloudflare.com/cdn-cgi/trace')
                .then(r => r.text())
                .then(txt => {
                    const lines = txt.split('\n');
                    const ipLine = lines.find(l => l.startsWith('ip=')) || '';
                    const locLine = lines.find(l => l.startsWith('loc=')) || '';
                    const ip = ipLine.split('=')[1] || '';
                    const loc = locLine.split('=')[1] || '';
                    const clientText = ip ? `Client ${loc} ${ip}` : 'Client Unavailable';
                    document.getElementById('clientInfo').innerText = clientText;
                    document.getElementById('serverInfo').innerText = loc ? `Server(s) ${loc}` : 'Server(s) Unavailable';
                })
                .catch(() => {
                    document.getElementById('clientInfo').innerText = 'Client Unavailable';
                    document.getElementById('serverInfo').innerText = 'Server(s) Unavailable';
                });
        });
}

async function runSpeedTest() {
    isTesting = true;
    const numDisplay = document.getElementById('numDisplay');
    const unitDisplay = document.getElementById('unitDisplay');
    const actionBtn = document.getElementById('actionBtn');
    const toggleBtn = document.getElementById('toggleBtn');

    // UI reset
    numDisplay.className = "number testing";
    actionBtn.innerText = "⏸";
    actionBtn.title = "Pause";
    actionBtn.classList.remove('finished');
    actionBtn.classList.add('testing');
    toggleBtn.disabled = true;

    // Close info panel if open
    const infoContainer = document.getElementById('moreInfo');
    if (infoContainer.classList.contains('open')) {
        infoContainer.classList.remove('open');
        toggleBtn.innerText = "Show more info";
    }

    // Measure unloaded latency BEFORE download starts
    const unloadedLatency = await measureUnloadedLatency();
    document.getElementById('latencyUnloadedVal').innerText = `${unloadedLatency.toFixed(1)}`;

    // Reset other stats
    document.getElementById('latencyLoadedVal').innerText = "--";
    document.getElementById('uploadSpeedVal').innerText = "--";
    document.getElementById('downloadData').innerText = "-- MB ⬇";
    document.getElementById('uploadData').innerText = "-- MB ⬆";

    // Reset global counters
    totalDownloadedBytes = 0;
    totalUploadedBytes = 0;

    abortController = new AbortController();

    const testPayloads = [
        "https://speed.cloudflare.com/__down?bytes=2000000",
        "https://speed.cloudflare.com/__down?bytes=5000000",
        "https://speed.cloudflare.com/__down?bytes=10000000"
    ];

    let totalBytes = 0;
    const startTime = performance.now();
    let targetSpeed = 0;
    let currentAnimatedSpeed = 0;

    // Animation loop for smooth number updates
        animInterval = setInterval(() => {
            if (!isTesting) return;
            const diff = targetSpeed - currentAnimatedSpeed;
            if (Math.abs(diff) > 0.01) {
                currentAnimatedSpeed += diff * 0.15;
            } else {
                currentAnimatedSpeed = targetSpeed;
            }
            if (currentAnimatedSpeed < 1 && currentAnimatedSpeed > 0) {
                numDisplay.innerText = Math.round(currentAnimatedSpeed * 1024);
                unitDisplay.innerText = 'Kbps';
            } else {
                numDisplay.innerText = currentAnimatedSpeed.toFixed(1);
                unitDisplay.innerText = 'Mbps';
            }
        }, 50);

    // Duration timeout
    timerId = setTimeout(() => {
        stopSpeedTest();
    }, settings.duration * 1000);

    // Parallel fetch workers based on connections setting
    const queue = testPayloads.map(u => u + "&t=" + Date.now());
    async function worker() {
        while (queue.length && isTesting) {
            const url = queue.shift();
            try {
                const response = await fetch(url, { cache: "no-store", signal: abortController.signal });
                const reader = response.body.getReader();
                while (true) {
                    if (!isTesting) break;
                    const { done, value } = await reader.read();
                    if (done) break;
                    totalBytes += value.length;
                    totalDownloadedBytes += value.length;
                    // Update download data display in real time
                    const downloadElem = document.getElementById('downloadData');
                    if (downloadElem) {
                        const mb = (totalDownloadedBytes / (1024 * 1024)).toFixed(1);
                        downloadElem.innerText = `${mb} MB ⬇`;
                    }
                    const now = performance.now();
                    const dur = (now - startTime) / 1000;
                    if (dur > 0.1) {
                        targetSpeed = ((totalBytes * 8) / dur) / 1000000;
                    }
                }
            } catch (e) {
                // ignore abort errors
            }
        }
    }
    const workers = [];
    for (let i = 0; i < settings.connections; i++) workers.push(worker());
    await Promise.all(workers);

    if (isTesting) {
        const finalDuration = (performance.now() - startTime) / 1000;
        const finalMbps = ((totalBytes * 8) / finalDuration) / 1000000;
        if (settings.upload) {
            await performUploadTest(finalMbps, totalBytes);
        } else {
            await finishTest(finalMbps, totalBytes);
        }
    // Measure loaded latency after test completes
    const loadedLatency = await measureLatency();
    document.getElementById('latencyLoadedVal').innerText = `${loadedLatency.toFixed(1)}`;
    }
}

// Simple latency measurement using a lightweight fetch (used for loaded latency)
async function measureLatency() {
    const start = performance.now();
    try {
        await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' });
    } catch (e) {
        // ignore errors, still calculate elapsed time
    }
    return (performance.now() - start);
}

// Measure unloaded latency before download starts by averaging three quick requests
async function measureUnloadedLatency() {
    const url = 'https://speed.cloudflare.com/__down?bytes=0';
    const attempts = 3;
    let total = 0;
    for (let i = 0; i < attempts; i++) {
        const start = performance.now();
        try {
            await fetch(url, { cache: 'no-store' });
        } catch (e) {
            // ignore errors, still count time
        }
        total += performance.now() - start;
    }
    return total / attempts;
}

function performUploadTest(downloadMbps, downloadedBytes) {
    // Use XMLHttpRequest to get progress events for a smoother live upload speed display
    const uploadUrl = "https://speed.cloudflare.com/__up?bytes=5000000";
    const data = new Uint8Array(5_000_000);
    const xhr = new XMLHttpRequest();
    let start = performance.now();

    xhr.open('POST', uploadUrl);
    xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
            const elapsed = (performance.now() - start) / 1000; // seconds
            const uploaded = e.loaded; // bytes
            totalUploadedBytes = uploaded;
            const uploadMbps = ((uploaded * 8) / elapsed) / 1000000;
            document.getElementById('uploadSpeedVal').innerText = uploadMbps.toFixed(1);
            // Update upload data display in real time
            const uploadElem = document.getElementById('uploadData');
            if (uploadElem) {
                const mb = (totalUploadedBytes / (1024 * 1024)).toFixed(1);
                uploadElem.innerText = `${mb} MB ⬆`;
            }
        }
    };
    xhr.onload = function () {
        // Ensure final speed is displayed (may already be close)
        const totalDur = (performance.now() - start) / 1000;
        const finalMbps = ((data.byteLength * 8) / totalDur) / 1000000;
        document.getElementById('uploadSpeedVal').innerText = finalMbps.toFixed(1);
        // Update total uploaded bytes counter
        totalUploadedBytes = data.byteLength;
        finishTest(downloadMbps, downloadedBytes + data.byteLength);
    };
    xhr.onerror = function () {
        // On error, just finish without upload speed
        finishTest(downloadMbps, downloadedBytes);
    };
    // Abort handling – if the main test is stopped, abort the upload as well
    if (abortController) {
        abortController.signal.addEventListener('abort', () => xhr.abort());
    }
    xhr.send(data);
}

function finishTest(finalMbps, totalBytes) {
    isTesting = false;
    clearInterval(animInterval);
    clearTimeout(timerId);

    const numDisplay = document.getElementById('numDisplay');
    const unitDisplay = document.getElementById('unitDisplay');
    const actionBtn = document.getElementById('actionBtn');
    const toggleBtn = document.getElementById('toggleBtn');

    numDisplay.className = "number finished";
    if (finalMbps < 1) {
        numDisplay.innerText = Math.round(finalMbps * 1024);
        unitDisplay.innerText = 'Kbps';
    } else {
        numDisplay.innerText = finalMbps > 10 ? finalMbps.toFixed(0) : finalMbps.toFixed(1);
        unitDisplay.innerText = 'Mbps';
    }
    actionBtn.innerText = "↻";
    actionBtn.title = "Re-test";
    // Apply finished styling (green ring) and remove testing spinner
    actionBtn.classList.remove('testing');
    actionBtn.classList.add('finished');
    toggleBtn.disabled = false;

    // Populate total data used metric (do not overwrite latency values which were set earlier)
    const totalMb = (totalBytes / (1024 * 1024)).toFixed(2);
    let totalDataElem = document.getElementById('totalData');
    if (!totalDataElem) {
        const container = document.querySelector('.grid-stats');
        const div = document.createElement('div');
        div.className = 'stat-item';
        div.innerHTML = `<div class="label">Total Data Used</div><div class="val" id="totalData">${totalMb} MB</div>`;
        container.appendChild(div);
    } else {
        totalDataElem.innerText = `${totalMb} MB`;
    }

    // Update download and upload data rows
    const downloadMb = (totalDownloadedBytes / (1024 * 1024)).toFixed(1);
    const uploadMb = (totalUploadedBytes / (1024 * 1024)).toFixed(1);
    const downloadElem = document.getElementById('downloadData');
    const uploadElem = document.getElementById('uploadData');
    if (downloadElem) downloadElem.innerText = `${downloadMb} MB ⬇`;
    if (uploadElem) uploadElem.innerText = `${uploadMb} MB ⬆`;
}

async function stopSpeedTest() {
    isTesting = false;
    if (abortController) abortController.abort();
    clearInterval(animInterval);
    clearTimeout(timerId);
    const numDisplay = document.getElementById('numDisplay');
    const actionBtn = document.getElementById('actionBtn');
    const toggleBtn = document.getElementById('toggleBtn');
    // Mark the displayed speed as finished (dimmed)
    numDisplay.className = "number finished";
    actionBtn.innerText = "↻";
    actionBtn.title = "Re-test";
    // Apply finished styling (green ring) and ensure spinner stopped
    actionBtn.classList.remove('testing');
    actionBtn.classList.add('finished');
    toggleBtn.disabled = false;
    // Measure loaded latency after pause
    const loadedLatency = await measureLatency();
    document.getElementById('latencyLoadedVal').innerText = `${loadedLatency.toFixed(1)}`;
    // Update upload data display if upload measurement was enabled
    if (settings.upload) {
        const uploadMb = (totalUploadedBytes / (1024 * 1024)).toFixed(1);
        const uploadElem = document.getElementById('uploadData');
        if (uploadElem) uploadElem.innerText = `${uploadMb} MB ⬆`;
        // Perform a quick upload test to provide a speed value
        const uploadUrl = "https://speed.cloudflare.com/__up?bytes=1000000";
        const start = performance.now();
        const data = new Uint8Array(1_000_000);
        try {
            await fetch(uploadUrl, { method: "POST", body: data, cache: "no-store" });
            const dur = (performance.now() - start) / 1000;
            const uploadMbps = ((data.byteLength * 8) / dur) / 1000000;
            document.getElementById('uploadSpeedVal').innerText = uploadMbps.toFixed(1);
        } catch (e) {
            // ignore errors, leave existing value
        }
    }
}

function toggleMoreInfo() {
    const infoContainer = document.getElementById('moreInfo');
    const toggleBtn = document.getElementById('toggleBtn');
    if (infoContainer.classList.contains('open')) {
        infoContainer.classList.remove('open');
        toggleBtn.innerText = "Show more info";
    } else {
        infoContainer.classList.add('open');
        toggleBtn.innerText = "Hide info";
    }
}
